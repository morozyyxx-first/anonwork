<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anonwork</title>
    <link rel="stylesheet" href="index_style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="main-header">
        <div class="logo">anonwork - анонимные вакансии</div>
        <a href="new_item.html" class="btn-create">Разместить вакансию</a>
    </header>

    <!-- Главный контент -->
    <main class="catalog-container">
        <section class="welcome-section">
            <h1>Путь в IT начинается здесь</h1>
            <p>Актуальные предложения от технологических компаний</p>
        </section>

        <!-- Контейнер, куда JS вставит карточки из базы данных -->
        <div class="vacancies-grid" id="vacanciesContainer">
            <!-- Сюда с помощью цикла JS вставит вакансии (пока тут пусто) -->
        </div>
    </main>

    <script>
        // Функция, которая запрашивает вакансии у бэкенда и рендерит их
        async function fetchAndRenderJobs() {
            const container = document.getElementById('vacanciesContainer');

            try {
                // 1. Делаем GET-запрос к твоей готовой ручке на FastAPI
                // Замени URL на свой эндпоинт, например: http://127.0.0.1:7777/products/all или /jobs/all
                const response = await fetch("http://192.168.100.51:7777/items/get");

                if (!response.ok) {
                    throw new Error("Не удалось загрузить вакансии");
                }

                // 2. Получаем список словарей [{}, {}, {}]
                const jobs = await response.json();

                // Очищаем контейнер (на случай, если там что-то было)
                container.innerHTML = "";

                // Проверяем, если вакансий в базе нет вообще
                if (jobs.length === 0) {
                    container.innerHTML = `<p class="no-jobs">Пока нет доступных вакансий. Будьте первым, кто разместит!</p>`;
                    return;
                }

                // 3. ЦИКЛ: Проходим по каждому элементу массива
                jobs.forEach(job => {
                    // Обрабатываем теги навыков (если они приходят строкой или массивом)
                    // Для примера сделаем заглушку, либо если у тебя это массив строк:
                    let tagsHtml = "";
                    if (job.skills && Array.isArray(job.skills)) {
                        tagsHtml = job.skills.map(skill => `<span class="tag">${skill}</span>`).join('');
                    } else {
                        // Если навыки записаны просто в описании или их пока нет, выведем дефолтные
                        tagsHtml = `<span class="tag">Удаленка</span><span class="tag">IT</span>`;
                    }

                    // 4. Создаем HTML-код карточки динамически, подставляя ключи из твоего словаря
                    const jobCard = `
                        <div class="job-card">
                            <div class="card-header">
                                <span class="company-name">${job.name_of_company || 'Компания'}</span>
                                <span class="job-location">📍 ${job.location || 'Локация'}</span>
                            </div>
                            <h3 class="job-title">${job.name || job.title}</h3>
                            <h5>${job.contacts}</h5>
                            <p class="job-salary">${job.salary}</p>
                            <p class="job-description">${job.description}</p>
                            <div class="card-footer">
                                <div class="job-tags">
                                    ${tagsHtml}
                                </div>
                                <button class="btn-respond">Откликнуться</button>
                            </div>
                        </div>
                    `;

                    // 5. Добавляем созданную карточку в общий контейнер на странице
                    container.innerHTML += jobCard;
                });

            } catch (error) {
                console.error("Ошибка при получении данных:", error);
                container.innerHTML = `<p class="error-msg">Ошибка загрузки вакансий. Проверьте, запущен ли бэкенд.</p>`;
            }
        }

        // Запускаем функцию сразу при загрузке страницы index.html
        document.addEventListener("DOMContentLoaded", fetchAndRenderJobs);
    </script>
</body>
</html>
